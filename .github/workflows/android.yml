name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (slot math, all themes)
        run: ./gradlew :engine:test --stacktrace

      - name: Debug APK (all themes bundled)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Release bundle (themes as Play Asset Delivery packs)
        run: ./gradlew :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: slots-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slots-release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
