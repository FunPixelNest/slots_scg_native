name: Android build

on:
  push:
    branches-ignore: [screenshots]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (slot math, all themes)
        run: ./gradlew :engine:test --stacktrace

      - name: Screenshots of the real app screens (Robolectric + Roborazzi)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Publish screenshots to the 'screenshots' branch
        if: always()
        run: |
          set -e
          ls app/build/screenshots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          echo "Screenshots for ${GITHUB_SHA} (${GITHUB_REF_NAME})" > README.md
          git init -q && git checkout -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots

      - name: Debug APK (test build)
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: slots-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-report
          path: engine/build/reports/tests/test
